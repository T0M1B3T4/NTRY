services:
  attacker:
    container_name: attacker-lab

    build:
      context: ./attacker
      dockerfile: Dockerfile

    working_dir: /app

    volumes:
      - ./attacker:/app

    networks:
      - cyberlab_net

    stdin_open: true
    tty: true

    restart: unless-stopped

    command: tail -f /dev/null

  backend:
    container_name: backend-lab

    build:
      context: ./backend
      dockerfile: Dockerfile

    volumes:
      - ./backend:/app

    networks:
      - cyberlab_net

    ports:
      - "8000:8000"

    restart: unless-stopped

networks:
  cyberlab_net:
    driver: bridge